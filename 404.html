ces on Kafka, fault-tolerant batch orchestration, and low-latency access over multi-million-row datasets. I have an M.S. in computer science from Indiana State University (2025).&lt;/p&gt;\n&lt;dl class=\&quot;contact\&quot;&gt;\n  &lt;div&gt;&lt;dt&gt;email&lt;/dt&gt;&lt;dd&gt;&lt;a href=\&quot;mailto:kolliparavamsikrishna80@gmail.com\&quot;&gt;kolliparavamsikrishna80@gmail.com&lt;/a&gt;&lt;/dd&gt;&lt;/div&gt;\n  &lt;div&gt;&lt;dt&gt;github&lt;/dt&gt;&lt;dd&gt;&lt;a href=\&quot;https://github.com/vamsi876\&quot;&gt;github.com/vamsi876&lt;/a&gt;&lt;/dd&gt;&lt;/div&gt;\n  &lt;div&gt;&lt;dt&gt;linkedin&lt;/dt&gt;&lt;dd&gt;&lt;a href=\&quot;https://linkedin.com/in/vamsikollipara\&quot;&gt;linkedin.com/in/vamsikollipara&lt;/a&gt;&lt;/dd&gt;&lt;/div&gt;\n&lt;/dl&gt;&quot;],&quot;snippet&quot;:[0,&quot;I&#39;m Vamsi.&quot;],&quot;pinned&quot;:[0,true]}]}]}]}],[0,{&quot;name&quot;:[0,&quot;projects&quot;],&quot;path&quot;:[0,&quot;/projects&quot;],&quot;kind&quot;:[0,&quot;Folder&quot;],&quot;icon&quot;:[0,&quot;folder&quot;],&quot;children&quot;:[1,[[0,{&quot;name&quot;:[0,&quot;patchpilot.app&quot;],&quot;path&quot;:[0,&quot;/projects/patchpilot&quot;],&quot;kind&quot;:[0,&quot;Web app&quot;],&quot;icon&quot;:[0,&quot;app&quot;],&quot;created&quot;:[0,&quot;2026-09-21&quot;],&quot;meta&quot;:[1,[[1,[[0,&quot;Kind&quot;],[0,&quot;Web app&quot;]]],[1,[[0,&quot;Created&quot;],[0,&quot;Sep 21, 2026&quot;]]],[1,[[0,&quot;Stack&quot;],[0,&quot;FastAPI, Next.js, Anthropic API, GitHub Apps&quot;]]],[1,[[0,&quot;Status&quot;],[0,&quot;in progress&quot;]]]]],&quot;previewImage&quot;:[0,&quot;/_astro/patchpilot-1.CkhHPCR2_Z1OUpJv.webp&quot;],&quot;blurb&quot;:[0,&quot;an AI reviewer that reads every pull request and keeps one summary comment updated&quot;],&quot;open&quot;:[0,{&quot;app&quot;:[0,&quot;notes&quot;],&quot;props&quot;:[0,{&quot;note&quot;:[0,{&quot;id&quot;:[0,&quot;patchpilot&quot;],&quot;path&quot;:[0,&quot;/projects/patchpilot&quot;],&quot;title&quot;:[0,&quot;(project) PatchPilot&quot;],&quot;created&quot;:[0,&quot;2026-09-21&quot;],&quot;html&quot;:[0,&quot;&lt;p&gt;an AI reviewer that reads every pull request and keeps one summary comment updated&lt;/p&gt;\n&lt;dl class=\&quot;contact\&quot;&gt;&lt;div&gt;&lt;dt&gt;kind&lt;/dt&gt;&lt;dd&gt;Web app&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;stack&lt;/dt&gt;&lt;dd&gt;FastAPI, Next.js, Anthropic API, GitHub Apps&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;status&lt;/dt&gt;&lt;dd&gt;in progress&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;repo&lt;/dt&gt;&lt;dd&gt;&lt;a href=\&quot;https://github.com/vamsi876/patchpilot\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener\&quot;&gt;github.com/vamsi876/patchpilot&lt;/a&gt;&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;\n&lt;p&gt;&lt;img src=\&quot;/_astro/patchpilot-1.CkhHPCR2_Z1OUpJv.webp\&quot; alt=\&quot;PatchPilot screenshot 1\&quot; loading=\&quot;lazy\&quot; decoding=\&quot;async\&quot; /&gt;&lt;/p&gt;\n&lt;p&gt;PatchPilot is an AI code reviewer for GitHub pull requests, built as a production-oriented full-stack project: a FastAPI backend, a Next.js dashboard, and Anthropic’s API doing the review work, wired together through a GitHub App.&lt;/p&gt;\n&lt;p&gt;When a PR is opened or updated, the backend verifies the webhook signature (HMAC-SHA256), deduplicates the delivery, fetches the PR metadata and raw diff, and runs one structured review against the diff. It then publishes a single summary comment — tagged so every later push updates the same comment instead of spamming the thread. The dashboard streams review progress live.&lt;/p&gt;\n&lt;p&gt;Phase 1 is a deliberately thin vertical slice: one review pass, in-memory state, no persistence. The roadmap is the interesting part — retrieval over the repo with pgvector for context-aware reviews, Temporal for durable review pipelines, and Redis/Postgres for state and caching.&lt;/p&gt;\n&quot;],&quot;snippet&quot;:[0,&quot;an AI reviewer that reads every pull request and keeps one summary comment updated&quot;]}]}]}]}],[0,{&quot;name&quot;:[0,&quot;clinical-audit.app&quot;],&quot;path&quot;:[0,&quot;/projects/clinical-audit&quot;],&quot;kind&quot;:[0,&quot;LLM platform&quot;],&quot;icon&quot;:[0,&quot;app&quot;],&quot;created&quot;:[0,&quot;2025-07-01&quot;],&quot;meta&quot;:[1,[[1,[[0,&quot;Kind&quot;],[0,&quot;LLM platform&quot;]]],[1,[[0,&quot;Created&quot;],[0,&quot;Jul 1, 2025&quot;]]],[1,[[0,&quot;Stack&quot;],[0,&quot;Python, Anthropic API, GCP, PostgreSQL, React, GraphQL&quot;]]],[1,[[0,&quot;Status&quot;],[0,&quot;work&quot;]]]]],&quot;previewImage&quot;:[0,&quot;/_astro/clinical-audit-1.fLT1GWQD_6a8L3.webp&quot;],&quot;blurb&quot;:[0,&quot;HIPAA-aligned LLM platform running a 120-question clinical audit protocol in production&quot;],&quot;open&quot;:[0,{&quot;app&quot;:[0,&quot;notes&quot;],&quot;props&quot;:[0,{&quot;note&quot;:[0,{&quot;id&quot;:[0,&quot;clinical-audit&quot;],&quot;path&quot;:[0,&quot;/projects/clinical-audit&quot;],&quot;title&quot;:[0,&quot;(project) Clinical audit platform&quot;],&quot;created&quot;:[0,&quot;2025-07-01&quot;],&quot;html&quot;:[0,&quot;&lt;p&gt;HIPAA-aligned LLM platform running a 120-question clinical audit protocol in production&lt;/p&gt;\n&lt;dl class=\&quot;contact\&quot;&gt;&lt;div&gt;&lt;dt&gt;kind&lt;/dt&gt;&lt;dd&gt;LLM platform&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;stack&lt;/dt&gt;&lt;dd&gt;Python, Anthropic API, GCP, PostgreSQL, React, GraphQL&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;status&lt;/dt&gt;&lt;dd&gt;work&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;\n&lt;p&gt;&lt;img src=\&quot;/_astro/clinical-audit-1.fLT1GWQD_6a8L3.webp\&quot; alt=\&quot;Clinical audit platform screenshot 1\&quot; loading=\&quot;lazy\&quot; decoding=\&quot;async\&quot; /&gt;&lt;/p&gt;\n&lt;p&gt;A work project at AI Data Management, where I’m the founding engineer. The platform runs a 120-question clinical audit protocol across six question-type handlers, with every LLM response validated against a JSON schema before it goes anywhere.&lt;/p&gt;\n&lt;p&gt;The headline numbers: audit throughput tripled from 10 to 30+ audits per day, holding 94% agreement against a physician-reviewed gold standard. Under the hood, it’s a study in operating LLM systems inside a regulated environment — HIPAA technical safeguards at the application layer (access control, audit logging, encryption in transit and at rest), delegated scope-limited authorization (Azure AD SSO, RBAC across eight roles, Postgres Row-Level Security with JWT claims propagated into database sessions so authorization is enforced in exactly one layer), and production LLM ops: concurrency management inside Anthropic API rate limits, prompt caching on shared protocol prefixes, and human-in-the-loop review queues that keep every model decision traceable to a reviewer.&lt;/p&gt;\n&lt;p&gt;Data lands through idempotent ELT on GCP — Google Batch jobs, Terraform-provisioned, EHR extracts upserted on encounter IDs so retries and partial failures never duplicate records. The product surface is a React frontend over a PostGraphile GraphQL API on Postgres.&lt;/p&gt;\n&quot;],&quot;snippet&quot;:[0,&quot;HIPAA-aligned LLM platform running a 120-question clinical audit protocol in production&quot;]}]}]}]}],[0,{&quot;name&quot;:[0,&quot;webweaver.app&quot;],&quot;path&quot;:[0,&quot;/projects/webweaver&quot;],&quot;kind&quot;:[0,&quot;Open source&quot;],&quot;icon&quot;:[0,&quot;app&quot;],&quot;created&quot;:[0,&quot;2024-09-01&quot;],&quot;meta&quot;:[1,[[1,[[0,&quot;Kind&quot;],[0,&quot;Open source&quot;]]],[1,[[0,&quot;Created&quot;],[0,&quot;Sep 1, 2024&quot;]]],[1,[[0,&quot;Stack&quot;],[0,&quot;Python, asyncio, aiohttp&quot;]]],[1,[[0,&quot;Status&quot;],[0,&quot;published&quot;]]]]],&quot;previewImage&quot;:[0,&quot;/_astro/webweaver-1.CqmGSf6K_ZT35QC.webp&quot;],&quot;blurb&quot;:[0,&quot;async Python web-crawling library, published on PyPI&quot;],&quot;open&quot;:[0,{&quot;app&quot;:[0,&quot;notes&quot;],&quot;props&quot;:[0,{&quot;note&quot;:[0,{&quot;id&quot;:[0,&quot;webweaver&quot;],&quot;path&quot;:[0,&quot;/projects/webweaver&quot;],&quot;title&quot;:[0,&quot;(project) WebWeaver&quot;],&quot;created&quot;:[0,&quot;2024-09-01&quot;],&quot;html&quot;:[0,&quot;&lt;p&gt;async Python web-crawling library, published on PyPI&lt;/p&gt;\n&lt;dl class=\&quot;contact\&quot;&gt;&lt;div&gt;&lt;dt&gt;kind&lt;/dt&gt;&lt;dd&gt;Open source&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;stack&lt;/dt&gt;&lt;dd&gt;Python, asyncio, aiohttp&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;status&lt;/dt&gt;&lt;dd&gt;published&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;demo&lt;/dt&gt;&lt;dd&gt;&lt;a href=\&quot;https://pypi.org/project/webweaver/\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener\&quot;&gt;pypi.org/project/webweaver&lt;/a&gt;&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;\n&lt;p&gt;&lt;img src=\&quot;/_astro/webweaver-1.CqmGSf6K_ZT35QC.webp\&quot; alt=\&quot;WebWeaver screenshot 1\&quot; loading=\&quot;lazy\&quot; decoding=\&quot;async\&quot; /&gt;&lt;/p&gt;\n&lt;p&gt;WebWeaver is an async web-crawling library I co-authored during my graduate work at Indiana State University, published on PyPI in September 2024. It’s built on asyncio and aiohttp, with robots.txt compliance, URL deduplication, and both BFS and recursive crawl modes.&lt;/p&gt;\n&lt;p&gt;It wasn’t a toy — it was the ingestion layer for a real problem. Campus data-privacy rules prohibited external API calls, so we built our RAG knowledge assistant on self-hosted models and needed our own corpus. WebWeaver crawled 40,000+ university URLs, which we distilled into the 8,000-document policy corpus backing the Pinecone-backed assistant.&lt;/p&gt;\n&lt;p&gt;The design tension was politeness versus throughput: a crawler fast enough to chew through tens of thousands of pages without hammering any single host, which is where the async concurrency model and per-domain rate awareness earn their keep.&lt;/p&gt;\n&quot;],&quot;snippet&quot;:[0,&quot;async Python web-crawling library, published on PyPI&quot;]}]}]}]}],[0,{&quot;name&quot;:[0,&quot;duke-metering.app&quot;],&quot;path&quot;:[0,&quot;/projects/duke-metering&quot;],&quot;kind&quot;:[0,&quot;Data platform&quot;],&quot;icon&quot;:[0,&quot;app&quot;],&quot;created&quot;:[0,&quot;2022-01-01&quot;],&quot;meta&quot;:[1,[[1,[[0,&quot;Kind&quot;],[0,&quot;Data platform&quot;]]],[1,[[0,&quot;Created&quot;],[0,&quot;Jan 1, 2022&quot;]]],[1,[[0,&quot;Stack&quot;],[0,&quot;REST, Kafka, Redis, PostgreSQL&quot;]]],[1,[[0,&quot;Status&quot;],[0,&quot;work&quot;]]]]],&quot;previewImage&quot;:[0,&quot;/_astro/duke-metering-1.CZimFFLh_Z2ajTQD.webp&quot;],&quot;blurb&quot;:[0,&quot;metering and billing data platform for 10,000+ daily active users at Duke Energy&quot;],&quot;open&quot;:[0,{&quot;app&quot;:[0,&quot;notes&quot;],&quot;props&quot;:[0,{&quot;note&quot;:[0,{&quot;id&quot;:[0,&quot;duke-metering&quot;],&quot;path&quot;:[0,&quot;/projects/duke-metering&quot;],&quot;title&quot;:[0,&quot;(project) Smart-meter data services&quot;],&quot;created&quot;:[0,&quot;2022-01-01&quot;],&quot;html&quot;:[0,&quot;&lt;p&gt;metering and billing data platform for 10,000+ daily active users at Duke Energy&lt;/p&gt;\n&lt;dl class=\&quot;contact\&quot;&gt;&lt;div&gt;&lt;dt&gt;kind&lt;/dt&gt;&lt;dd&gt;Data platform&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;stack&lt;/dt&gt;&lt;dd&gt;REST, Kafka, Redis, PostgreSQL&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;status&lt;/dt&gt;&lt;dd&gt;work&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;\n&lt;p&gt;&lt;img src=\&quot;/_astro/duke-metering-1.CZimFFLh_Z2ajTQD.webp\&quot; alt=\&quot;Smart-meter data services screenshot 1\&quot; loading=\&quot;lazy\&quot; decoding=\&quot;async\&quot; /&gt;&lt;/p&gt;\n&lt;p&gt;Work from my time at Cognizant, building full-stack services for Duke Energy’s customer platform. The services I built served metering and billing data to 10,000+ daily active users, backed by multi-million-row smart-meter (AMI) tables.&lt;/p&gt;\n&lt;p&gt;The latency story: p95 response times dropped from 2.5 seconds to under 1 second through composite indexing and query optimization on those AMI tables, plus Redis read-through caching (15-minute TTL) on the read-heavy metering endpoints to absorb peak traffic.&lt;/p&gt;\n&lt;p&gt;On the event-driven side, I implemented Kafka consumers for outage and billing notification workflows with idempotent handling — retries are safe, and customers are never double-notified. It’s the kind of distributed-systems plumbing that’s invisible when it works and catastrophic when it doesn’t, which is exactly why the idempotency mattered.&lt;/p&gt;\n&quot;],&quot;snippet&quot;:[0,&quot;metering and billing data platform for 10,000+ daily active users at Duke Energy&quot;]}]}]}]}]]]}],[0,{&quot;name&quot;:[0,&quot;writing&quot;],&quot;path&quot;:[0,&quot;/writing&quot;],&quot;kind&quot;:[0,&quot;Folder&quot;],&quot;icon&quot;:[0,&quot;folder&quot;],&quot;children&quot;:[1,[]]}],[0,{&quot;name&quot;:[0,&quot;experience&quot;],&quot;path&quot;:[0,&quot;/experience&quot;],&quot;kind&quot;:[0,&quot;Folder&quot;],&quot;icon&quot;:[0,&quot;folder&quot;],&quot;open&quot;:[0,{&quot;app&quot;:[0,&quot;calendar&quot;],&quot;props&quot;:[0,{&quot;roles&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;ai-data-management&quot;],&quot;org&quot;:[0,&quot;AI Data Management&quot;],&quot;role&quot;:[0,&quot;Forward-Deployed Engineer&quot;],&quot;calendar&quot;:[0,&quot;work&quot;],&quot;start&quot;:[0,&quot;2025-07-01&quot;],&quot;highlights&quot;:[1,[[0,&quot;Built the Python orchestration layer running a 120-question clinical audit protocol across 6 question-type handlers with JSON-schema-validated LLM output; tripled throughput from 10 to 30+ audits/day while holding 94% agreement against a physician-reviewed gold standard&quot;],[0,&quot;Implemented HIPAA technical safeguards at the application layer: access control, audit logging, and encryption in transit and at rest&quot;],[0,&quot;Designed delegated, scope-limit
